<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Kim Bu Adam? - Futbolcu Tahmin Oyunu</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #022c22;
      background-image:
        radial-gradient(ellipse at 50% 25%, #064e3b 0%, #022c22 80%),
        linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #game-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    #game-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      flex: 1;
      background: transparent;
    }
    #loader {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #022c22;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      color: #ffffff;
      text-align: center;
      padding: 24px;
    }
    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .logo-pulse {
      width: 110px;
      height: 110px;
      margin-bottom: 20px;
      animation: pulse-glow 2s infinite ease-in-out;
      filter: drop-shadow(0 10px 25px rgba(16, 185, 129, 0.45));
    }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 10px 25px rgba(16, 185, 129, 0.45)); }
      50% { transform: scale(1.04); filter: drop-shadow(0 15px 35px rgba(52, 211, 153, 0.7)); }
    }
    .game-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .game-title span {
      color: #34d399;
    }
    .game-sub {
      font-size: 13px;
      color: #a7f3d0;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
      font-family: monospace;
    }
    .progress-bar-bg {
      width: 220px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #10b981, #34d399);
      border-radius: 999px;
      animation: load-anim 1.8s infinite ease-in-out;
    }
    @keyframes load-anim {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(50%); }
      100% { transform: translateX(250%); }
    }
    .load-text {
      font-size: 11px;
      color: #6ee7b7;
      margin-top: 10px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div id="loader">
    <img src="icon.svg" class="logo-pulse" alt="Logo" />
    <div class="game-title">KİM BU ADAM<span>?</span></div>
    <div class="game-sub">Kariyer & Transfer Bulmaca</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill"></div>
    </div>
    <div class="load-text">Stadyum yükleniyor...</div>
  </div>

  <div id="game-container">
    <iframe
      id="game-frame"
      src="https://kimbuadam.netlify.app/"
      allow="autoplay; fullscreen; clipboard-write; clipboard-read"
      allowfullscreen="true"
      loading="eager"
    ></iframe>
  </div>

  <script>
    const frame = document.getElementById('game-frame');
    const loader = document.getElementById('loader');

    // Hide loader once the frame loads or after fallback timeout
    let loaded = false;
    function hideLoader() {
      if (loaded) return;
      loaded = true;
      loader.classList.add('hidden');
    }

    frame.addEventListener('load', () => {
      setTimeout(hideLoader, 600);
    });

    // Fallback: guaranteed hide after 2.5s
    setTimeout(hideLoader, 2500);

    // Auto-focus the game frame so keyboard inputs work immediately
    window.addEventListener('click', () => {
      try { frame.contentWindow.focus(); } catch (e) {}
    });
  </script>
</body>
</html>
