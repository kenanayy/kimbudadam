<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KİM BU ADAM? • Logo Çıktısı & İndirme Aracı</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #10b981;
      --gold: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: linear-gradient(135deg, #022c22 0%, #064e3b 40%, #0f172a 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 860px;
      width: 100%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #6ee7b7, #ffffff, #fef08a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .header p {
      font-size: 14px;
      color: #94a3b8;
    }

    .main-showcase {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
      padding: 30px;
      border-radius: 24px;
      margin-bottom: 32px;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .logo-frame {
      width: 260px;
      height: 260px;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.45));
      transition: transform 0.3s ease;
    }
    .logo-frame:hover {
      transform: scale(1.04) rotate(-1deg);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin-top: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 24px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
      transform: translateY(-2px);
      box-shadow: 0 15px 25px -5px rgba(16, 185, 129, 0.5);
    }
    .btn-gold {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #ffffff;
      box-shadow: 0 10px 20px -5px rgba(245, 158, 11, 0.4);
    }
    .btn-gold:hover {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    /* Farklı Boyut ve Arka Plan Önizlemeleri */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 24px;
    }
    .preview-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }
    .preview-card.light {
      background: #f8fafc;
      color: #0f172a;
    }
    .preview-card.dark {
      background: #022c22;
    }
    .preview-card h3 {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
      opacity: 0.8;
    }

    canvas { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>KİM BU ADAM?</h1>
      <p>Resmi Logo Çıktısı • Yüksek Çözünürlüklü Vektör & PNG İndirme</p>
    </div>

    <!-- Ana Vitrin -->
    <div class="main-showcase">
      <div id="svgContainer" class="logo-frame">
        <!-- Gömülü SVG -->
        <svg id="mainLogoSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
          <defs>
            <radialGradient id="squircleBg" cx="25%" cy="20%" r="90%" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#10b981" />
              <stop offset="35%" stop-color="#059669" />
              <stop offset="75%" stop-color="#064e3b" />
              <stop offset="100%" stop-color="#022c22" />
            </radialGradient>
            <linearGradient id="squircleBorder" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#a7f3d0" />
              <stop offset="50%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#047857" />
            </linearGradient>
            <linearGradient id="goldAdam" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="35%" stop-color="#fef08a" />
              <stop offset="100%" stop-color="#f59e0b" />
            </linearGradient>
            <linearGradient id="neonQuestion" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#a7f3d0" />
              <stop offset="100%" stop-color="#34d399" />
            </linearGradient>
            <linearGradient id="topGloss" x1="60" y1="6" x2="60" y2="60" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
            </linearGradient>
            <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#022c22" flood-opacity="0.8" />
            </filter>
            <filter id="questionGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#34d399" flood-opacity="0.9" />
            </filter>
          </defs>

          <rect x="4" y="4" width="112" height="112" rx="28" ry="28" fill="url(#squircleBg)" stroke="url(#squircleBorder)" stroke-width="3.2" />

          <g opacity="0.09">
            <line x1="0" y1="24" x2="120" y2="24" stroke="#ffffff" stroke-width="9" />
            <line x1="0" y1="46" x2="120" y2="46" stroke="#ffffff" stroke-width="9" />
            <line x1="0" y1="68" x2="120" y2="68" stroke="#ffffff" stroke-width="9" />
            <line x1="0" y1="90" x2="120" y2="90" stroke="#ffffff" stroke-width="9" />
          </g>

          <circle cx="60" cy="60" r="36" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.12" stroke-dasharray="4 4" />
          <rect x="8" y="8" width="104" height="104" rx="24" ry="24" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.25" />
          <path d="M 6 32 C 6 18, 18 6, 32 6 L 88 6 C 102 6, 114 18, 114 32 L 114 44 C 74 50, 36 42, 6 64 Z" fill="url(#topGloss)" />

          <text x="60" y="45" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" letter-spacing="2.2" filter="url(#textShadow)">KİM BU</text>

          <text x="60" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" filter="url(#textShadow)">
            <tspan fill="url(#goldAdam)" font-size="24" letter-spacing="1.2">ADAM</tspan>
            <tspan fill="url(#neonQuestion)" font-size="28" dx="4" filter="url(#questionGlow)">?</tspan>
          </text>

          <path d="M 22 96 L 46 96" stroke="#fef08a" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75" />
          <path d="M 74 96 L 98 96" stroke="#fef08a" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75" />

          <g transform="translate(60, 96)">
            <circle cx="0" cy="0" r="7.5" fill="#ffffff" stroke="#064e3b" stroke-width="1.5" />
            <polygon points="0,-3 2.8,-1 1.7,2.5 -1.7,2.5 -2.8,-1" fill="#064e3b" />
            <line x1="0" y1="-3" x2="0" y2="-7.5" stroke="#064e3b" stroke-width="1.1" />
            <line x1="2.8" y1="-1" x2="6.8" y2="-2.5" stroke="#064e3b" stroke-width="1.1" />
            <line x1="1.7" y1="2.5" x2="4.5" y2="6" stroke="#064e3b" stroke-width="1.1" />
            <line x1="-1.7" y1="2.5" x2="-4.5" y2="6" stroke="#064e3b" stroke-width="1.1" />
            <line x1="-2.8" y1="-1" x2="-6.8" y2="-2.5" stroke="#064e3b" stroke-width="1.1" />
          </g>
        </svg>
      </div>

      <!-- İndirme Butonları -->
      <div class="actions">
        <button onclick="downloadPNG(512)" class="btn btn-primary">
          📥 PNG İndir (512x512 HD)
        </button>
        <button onclick="downloadPNG(1024)" class="btn btn-gold">
          ✨ Ultra HD PNG İndir (1024x1024)
        </button>
        <button onclick="downloadSVG()" class="btn btn-secondary">
          🎨 Vektör SVG İndir
        </button>
      </div>
    </div>

    <!-- Farklı Zemin Önizlemeleri -->
    <div class="preview-grid">
      <div class="preview-card light">
        <h3>Beyaz Zemin Üstünde</h3>
        <div style="width: 100px; height: 100px; margin: 0 auto;">
          <svg viewBox="0 0 120 120" width="100%" height="100%"><use href="#mainLogoSvg" /></svg>
        </div>
      </div>

      <div class="preview-card dark">
        <h3>Koyu Stadyum Üstünde</h3>
        <div style="width: 100px; height: 100px; margin: 0 auto;">
          <svg viewBox="0 0 120 120" width="100%" height="100%"><use href="#mainLogoSvg" /></svg>
        </div>
      </div>

      <div class="preview-card">
        <h3>Mobil İkon (64x64)</h3>
        <div style="width: 64px; height: 64px; margin: 0 auto 12px;">
          <svg viewBox="0 0 120 120" width="100%" height="100%"><use href="#mainLogoSvg" /></svg>
        </div>
        <span style="font-size: 11px; color: #94a3b8;">Uygulama İkonu</span>
      </div>
    </div>
  </div>

  <canvas id="exportCanvas"></canvas>

  <script>
    function downloadPNG(size) {
      const svg = document.getElementById('mainLogoSvg');
      const svgData = new XMLSerializer().serializeToString(svg);
      const canvas = document.getElementById('exportCanvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const img = new Image();
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const URL = window.URL || window.webkitURL || window;
      const blobURL = URL.createObjectURL(svgBlob);

      img.onload = function() {
        ctx.clearRect(0, 0, size, size);
        ctx.drawImage(img, 0, 0, size, size);
        const pngUrl = canvas.toDataURL('image/png');
        
        const downloadLink = document.createElement('a');
        downloadLink.href = pngUrl;
        downloadLink.download = `kim-bu-adam-logo-${size}x${size}.png`;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        URL.revokeObjectURL(blobURL);
      };
      img.src = blobURL;
    }

    function downloadSVG() {
      const svg = document.getElementById('mainLogoSvg');
      const svgData = new XMLSerializer().serializeToString(svg);
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const URL = window.URL || window.webkitURL || window;
      const blobURL = URL.createObjectURL(svgBlob);

      const downloadLink = document.createElement('a');
      downloadLink.href = blobURL;
      downloadLink.download = 'kim-bu-adam-logo.svg';
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
      URL.revokeObjectURL(blobURL);
    }
  </script>
</body>
</html>
