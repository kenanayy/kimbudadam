<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512" fill="none">
  <defs>
    <!-- Stadyum Çimi ve Zümrüt Radyal Degrade -->
    <radialGradient id="squircleBg" cx="25%" cy="20%" r="90%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="35%" stop-color="#059669" />
      <stop offset="75%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>

    <!-- Dış Çerçeve Degradesi (Altın & Zümrüt Işıltısı) -->
    <linearGradient id="squircleBorder" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- "ADAM" Kelimesi İçin Canlı Altın Degrade -->
    <linearGradient id="goldAdam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Soru İşareti İçin Neon Parıltı Degradesi -->
    <linearGradient id="neonQuestion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Üst Cam Parlama Degradesi -->
    <linearGradient id="topGloss" x1="60" y1="6" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Metin Gölgesi -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#022c22" flood-opacity="0.8" />
    </filter>

    <!-- Soru İşareti Işıma Efekti -->
    <filter id="questionGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#34d399" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- YUMUŞAK KÖŞELİ KARE GÖVDE -->
  <rect x="4" y="4" width="112" height="112" rx="28" ry="28" fill="url(#squircleBg)" stroke="url(#squircleBorder)" stroke-width="3.2" />

  <!-- SAHA ÇİMİ ÇİZGİLERİ (Hafif Fligran) -->
  <g opacity="0.09">
    <line x1="0" y1="24" x2="120" y2="24" stroke="#ffffff" stroke-width="9" />
    <line x1="0" y1="46" x2="120" y2="46" stroke="#ffffff" stroke-width="9" />
    <line x1="0" y1="68" x2="120" y2="68" stroke="#ffffff" stroke-width="9" />
    <line x1="0" y1="90" x2="120" y2="90" stroke="#ffffff" stroke-width="9" />
  </g>

  <!-- ORTA SAHA YUVARLAĞI DESENİ -->
  <circle cx="60" cy="60" r="36" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.12" stroke-dasharray="4 4" />

  <!-- İÇ İNCE KENARLIK -->
  <rect x="8" y="8" width="104" height="104" rx="24" ry="24" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.25" />

  <!-- ÜST CAM YANSIMASI -->
  <path d="M 6 32 C 6 18, 18 6, 32 6 L 88 6 C 102 6, 114 18, 114 32 L 114 44 C 74 50, 36 42, 6 64 Z" fill="url(#topGloss)" />

  <!-- "KİM BU" METNİ (Üst Satır) -->
  <text x="60" y="45" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" letter-spacing="2.2" filter="url(#textShadow)">KİM BU</text>

  <!-- "ADAM?" METNİ (Ortalanmış ve Hizalanmış Tek Blok) -->
  <text x="60" y="76" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" filter="url(#textShadow)">
    <tspan fill="url(#goldAdam)" font-size="24" letter-spacing="1.2">ADAM</tspan>
    <tspan fill="url(#neonQuestion)" font-size="28" dx="4" filter="url(#questionGlow)">?</tspan>
  </text>

  <!-- ALT KISIM: MİNİ FUTBOL TOPU VE KANAT ÇİZGİLERİ -->
  <path d="M 22 96 L 46 96" stroke="#fef08a" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75" />
  <path d="M 74 96 L 98 96" stroke="#fef08a" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75" />

  <!-- Mini Futbol Topu -->
  <g transform="translate(60, 96)">
    <circle cx="0" cy="0" r="7.5" fill="#ffffff" stroke="#064e3b" stroke-width="1.5" />
    <polygon points="0,-3 2.8,-1 1.7,2.5 -1.7,2.5 -2.8,-1" fill="#064e3b" />
    <line x1="0" y1="-3" x2="0" y2="-7.5" stroke="#064e3b" stroke-width="1.1" />
    <line x1="2.8" y1="-1" x2="6.8" y2="-2.5" stroke="#064e3b" stroke-width="1.1" />
    <line x1="1.7" y1="2.5" x2="4.5" y2="6" stroke="#064e3b" stroke-width="1.1" />
    <line x1="-1.7" y1="2.5" x2="-4.5" y2="6" stroke="#064e3b" stroke-width="1.1" />
    <line x1="-2.8" y1="-1" x2="-6.8" y2="-2.5" stroke="#064e3b" stroke-width="1.1" />
  </g>
</svg>

