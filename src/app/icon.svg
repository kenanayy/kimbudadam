<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- 1. Canlı Stadyum Çimi ve Zümrüt Radyal Degrade -->
    <radialGradient id="squircleBg" cx="30%" cy="25%" r="85%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>

    <!-- 2. Parlak Altın & Beyaz Dış Çerçeve -->
    <linearGradient id="squircleBorder" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- 3. "ADAM" Kelimesi İçin Canlı Altın Degrade -->
    <linearGradient id="goldAdam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- 4. Soru İşareti İçin Neon Parıltı Degradesi -->
    <linearGradient id="neonQuestion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- 5. Üst Cam Parlama Degradesi -->
    <linearGradient id="topGloss" x1="60" y1="6" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- YUMUŞAK KÖŞELİ KARE GÖVDE (CANLI ZÜMRÜT ÇİMİ) -->
  <rect x="4" y="4" width="112" height="112" rx="28" ry="28" fill="url(#squircleBg)" stroke="url(#squircleBorder)" stroke-width="4" />

  <!-- İÇ İNCE PARLAMA KENARLIĞI -->
  <rect x="8.5" y="8.5" width="103" height="103" rx="23.5" ry="23.5" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.35" />

  <!-- SAHA ÇİMİ ÇİZGİLERİ (Hafif Fligran) -->
  <g opacity="0.12">
    <line x1="0" y1="28" x2="120" y2="28" stroke="#ffffff" stroke-width="10" />
    <line x1="0" y1="56" x2="120" y2="56" stroke="#ffffff" stroke-width="10" />
    <line x1="0" y1="84" x2="120" y2="84" stroke="#ffffff" stroke-width="10" />
  </g>

  <!-- ORTA SAHA YUVARLAĞI DESENİ -->
  <circle cx="60" cy="60" r="36" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.15" stroke-dasharray="4 4" />

  <!-- ÜST CAM YANSIMASI -->
  <path d="M 6 32 C 6 18, 18 6, 32 6 L 88 6 C 102 6, 114 18, 114 32 L 114 44 C 74 50, 36 42, 6 64 Z" fill="url(#topGloss)" />

  <!-- "KİM BU" METNİ (Üst Satır) -->
  <text x="60" y="44" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18.5" letter-spacing="2">KİM BU</text>

  <!-- "ADAM?" METNİ (Ortalanmış ve Hizalanmış Tek Blok) -->
  <text x="60" y="75" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900">
    <tspan fill="url(#favGold)" font-size="24.5" letter-spacing="1">ADAM</tspan>
    <tspan fill="url(#favNeon)" font-size="29" dx="3">?</tspan>
  </text>

  <!-- ALT KISIM: MİNİ FUTBOL TOPU VE KANAT ÇİZGİLERİ -->
  <path d="M 20 95 L 45 95" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 75 95 L 100 95" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Mini Futbol Topu (Yüksek Kontrastlı) -->
  <g transform="translate(60, 95)">
    <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#047857" stroke-width="1.8" />
    <polygon points="0,-3.2 3.1,-1 1.9,2.7 -1.9,2.7 -3.1,-1" fill="#047857" />
    <line x1="0" y1="-3.2" x2="0" y2="-8" stroke="#047857" stroke-width="1.2" />
    <line x1="3.1" y1="-1" x2="7.5" y2="-2.6" stroke="#047857" stroke-width="1.2" />
    <line x1="1.9" y1="2.7" x2="4.9" y2="6.6" stroke="#047857" stroke-width="1.2" />
    <line x1="-1.9" y1="2.7" x2="-4.9" y2="6.6" stroke="#047857" stroke-width="1.2" />
    <line x1="-3.1" y1="-1" x2="-7.5" y2="-2.6" stroke="#047857" stroke-width="1.2" />
  </g>
</svg>